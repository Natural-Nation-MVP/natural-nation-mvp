name: Deploy Founder OS Home

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/founder-os/**'
      - 'docs/execution-packages/**'
      - 'docs/orchestration/**'
      - '.github/workflows/deploy-founder-os-pilot.yml'
      - '.github/workflows/founder-os-stabilization.yml'
      - 'scripts/validate-founder-os.mjs'
      - 'scripts/validate-founder-approval-inbox.mjs'
      - 'scripts/validate-founder-ux-001.mjs'
      - 'scripts/validate-founder-ws-001.mjs'
      - 'scripts/validate-founder-ws-005.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: founder-os-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete Founder OS contract set
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for validator in \
            scripts/validate-founder-os.mjs \
            scripts/validate-founder-approval-inbox.mjs \
            scripts/validate-founder-ux-001.mjs \
            scripts/validate-founder-ws-001.mjs \
            scripts/validate-founder-ws-005.mjs
          do
            echo "::group::Running ${validator}"
            node "${validator}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Founder OS site
        env:
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp docs/index.html _site/index.html
          cp -R docs/founder-os _site/founder-os
          cp -R docs/execution-packages _site/execution-packages
          cp -R docs/orchestration _site/orchestration

          test -f _site/founder-os/registry/workspaces.json
          test -f _site/founder-os/css/founder-os.css
          test -f _site/founder-os/css/founder-home-functionality.css
          test -f _site/founder-os/css/workspace-launch-center.css
          test -f _site/founder-os/js/workspace-registry.js
          test -f _site/founder-os/js/founder-home-functionality.js
          test -f _site/founder-os/js/navigation-manager-035.js
          jq -e '.schemaVersion == "2.0.0" and (.workspaces | type == "array")' _site/founder-os/registry/workspaces.json >/dev/null
          jq -e '.workspaces[] | select(.workspaceId | startswith("ws_"))' _site/founder-os/registry/workspaces.json >/dev/null
          grep -q "registry/workspaces.json" _site/founder-os/js/workspace-registry.js
          grep -q "function merge(" _site/founder-os/js/workspace-registry.js
          grep -q 'data-open-workspace=' _site/founder-os/js/workspace-registry.js
          grep -q 'data-open-workspace' _site/founder-os/js/founder-home-functionality.js
          grep -q 'openWorkspace' _site/founder-os/js/navigation-manager-035.js
          if grep -q 'data-workspace-link' _site/founder-os/js/workspace-registry.js; then
            echo "Legacy clickable workspace-card link markup remains in the deployment artifact."
            exit 1
          fi

          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          PR_NUMBER="$(printf '%s' "$COMMIT_SUBJECT" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')"
          MERGED_AT="$(git log -1 --pretty=%cI)"
          REVIEWED_HEAD_SHA="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          CHANGED_FILES_JSON="$(git diff --name-only HEAD^1 HEAD 2>/dev/null | node -e "const fs=require('fs'); const files=fs.readFileSync(0,'utf8').split(/\r?\n/).filter(Boolean); process.stdout.write(JSON.stringify(files));")"

          if [ -n "$PR_NUMBER" ]; then
            PR_URL="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}"
            cat > _site/founder-os/js/repository-review-context.js <<EOF
          window.NNOSRepositoryReviewContext = {
            repository: "${REPOSITORY}",
            number: ${PR_NUMBER},
            url: "${PR_URL}",
            state: "merged",
            merged: true,
            mergeable: false,
            checksPassed: true,
            headSha: "${REVIEWED_HEAD_SHA}",
            reviewedHeadSha: "${REVIEWED_HEAD_SHA}",
            founderApprovedHeadSha: "${REVIEWED_HEAD_SHA}",
            changedFiles: ${CHANGED_FILES_JSON},
            mergedAt: "${MERGED_AT}",
            mergeCommitSha: "${MERGE_SHA}",
            deploymentStatus: "success"
          };
          EOF
          else
            cat > _site/founder-os/js/repository-review-context.js <<EOF
          window.NNOSRepositoryReviewContext = null;
          EOF
          fi

          # The root page is only a redirect. The canonical shell owns every style and runtime.
          sed -i "s|</head>|  <meta name=\"founder-os-deployment-sha\" content=\"${MERGE_SHA}\">\n</head>|" _site/index.html

          # Cache-bust every versioned canonical asset together so Safari cannot mix generations.
          sed -i -E "s|([?&]v=[^\"']+)|\1-${MERGE_SHA}|g" _site/founder-os/index.html
          sed -i "s|</head>|  <meta name=\"founder-os-deployment-sha\" content=\"${MERGE_SHA}\">\n</head>|" _site/founder-os/index.html

          cat > _site/deployment.json <<EOF
          {
            "application": "Founder OS",
            "commitSha": "${MERGE_SHA}",
            "runId": "${RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "entryMode": "canonical-redirect",
            "workspaceCardMode": "static-grid-explicit-button"
          }
          EOF
          cp _site/deployment.json _site/founder-os/deployment.json

          grep -q 'founder-os-entry" content="canonical-redirect' _site/index.html
          if grep -Eq 'workspace-registry\.js|workspace-manager\.js|founder-home-functionality\.js' _site/index.html; then
            echo "Root redirect unexpectedly loads Founder OS runtime assets."
            exit 1
          fi
          grep -Eq "workspace-registry\.js\?v=[^\"']+-${MERGE_SHA}" _site/founder-os/index.html
          grep -Eq "founder-home-functionality\.css\?v=[^\"']+-${MERGE_SHA}" _site/founder-os/index.html
          grep -Eq "workspace-launch-center\.css\?v=[^\"']+-${MERGE_SHA}" _site/founder-os/index.html
          grep -Eq "founder-home-functionality\.js\?v=[^\"']+-${MERGE_SHA}" _site/founder-os/index.html
          grep -Eq "navigation-manager-035\.js\?v=[^\"']+-${MERGE_SHA}" _site/founder-os/index.html
          grep -q "founder-os-deployment-sha" _site/index.html
          grep -q "founder-os-deployment-sha" _site/founder-os/index.html
          touch _site/.nojekyll

      - name: Upload Founder OS Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Founder OS home
        id: deployment
        uses: actions/deploy-pages@v4
