name: Deploy Founder OS Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/founder-os-gateway/**"
      - ".github/workflows/deploy-founder-os-gateway.yml"

permissions:
  contents: read

concurrency:
  group: founder-os-gateway-production
  cancel-in-progress: false

env:
  EXPECTED_GATEWAY_VERSION: "0.7.1"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/founder-os-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Gateway tests
        run: npm test

      - name: Validate Worker bundle
        run: npm run check

      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare optional Founder OS runtime KV acceleration
        id: runtime-kv
        shell: bash
        run: |
          set -uo pipefail
          namespace_title="founder-os-runtime-store"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          namespace_id=""

          if list_response="$(curl --fail --silent --show-error -H "$auth_header" "$api?per_page=100" 2>/dev/null)"; then
            namespace_id="$(echo "$list_response" | jq -r --arg title "$namespace_title" '.result[] | select(.title == $title) | .id' | head -n 1)"
          fi

          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            if create_response="$(curl --fail --silent --show-error -X POST -H "$auth_header" -H "Content-Type: application/json" --data "{\"title\":\"${namespace_title}\"}" "$api" 2>/dev/null)"; then
              namespace_id="$(echo "$create_response" | jq -r '.result.id')"
            fi
          fi

          if [ -n "$namespace_id" ] && [ "$namespace_id" != "null" ]; then
            echo "namespace_id=$namespace_id" >> "$GITHUB_OUTPUT"
            echo "Founder OS runtime KV acceleration is ready."
          else
            echo "namespace_id=" >> "$GITHUB_OUTPUT"
            echo "KV acceleration unavailable; canonical repository recovery remains authoritative."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate production Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          namespace_id="${{ steps.runtime-kv.outputs.namespace_id }}"
          if [ -n "$namespace_id" ]; then
            jq --arg namespace_id "$namespace_id" '.kv_namespaces = [{"binding":"FOUNDER_OS_RUNTIME_STORE","id":$namespace_id}]' wrangler.jsonc > wrangler.deploy.json
            jq -e '.kv_namespaces[] | select(.binding == "FOUNDER_OS_RUNTIME_STORE" and (.id | length > 0))' wrangler.deploy.json >/dev/null
            echo "Production Worker configuration includes optional FOUNDER_OS_RUNTIME_STORE acceleration."
          else
            cp wrangler.jsonc wrangler.deploy.json
            echo "Production Worker configuration uses canonical repository recovery without KV acceleration."
          fi

      - name: Deploy Worker with durable recovery
        run: npx wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Worker version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            RESPONSE="$(curl --silent --show-error https://founder-os-gateway.dmoseley1024.workers.dev/version || true)"
            if echo "$RESPONSE" | jq -e --arg version "$EXPECTED_GATEWAY_VERSION" '.version == $version and .capabilities.workspaceCreationRecovery == "canonical-repository" and .capabilities.canonicalOrchestrationRoute == "enabled"' >/dev/null 2>&1; then
              echo "Cloudflare Worker v${EXPECTED_GATEWAY_VERSION} and durable workspace recovery verified."
              exit 0
            fi
            echo "Worker v${EXPECTED_GATEWAY_VERSION} not ready yet; retrying in 5 seconds."
            sleep 5
          done
          echo "Cloudflare Worker did not report the v${EXPECTED_GATEWAY_VERSION} durable recovery contract after deployment."
          echo "$RESPONSE"
          exit 1

      - name: Verify Founder OS health and durable recovery
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error https://founder-os-gateway.dmoseley1024.workers.dev/health)"
          CONFIG="$(curl --fail --silent --show-error https://founder-os-gateway.dmoseley1024.workers.dev/configuration)"
          echo "$HEALTH" | jq -e --arg version "$EXPECTED_GATEWAY_VERSION" '.status == "online" and .version == $version' >/dev/null
          echo "$CONFIG" | jq -e --arg version "$EXPECTED_GATEWAY_VERSION" '.version == $version' >/dev/null
          echo "$CONFIG" | jq -e '.required.durableWorkspaceRecovery == true' >/dev/null
          echo "$CONFIG" | jq -e '.optionalInfrastructure.recoverySystemOfRecord == "canonical-repository"' >/dev/null
          echo "$CONFIG" | jq -e '.configured == true' >/dev/null
          echo "Founder OS live health and canonical durable recovery verified."

      - name: Verify canonical orchestration endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://founder-os-gateway.dmoseley1024.workers.dev/v1/workspaces/natural-nation/packages/NN-BUILD-001/orchestration"
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' "$endpoint")"
          content_type="$(curl --silent --show-error --head "$endpoint" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -n 1)"
          body="$(cat "$body_file")"

          echo "Orchestration status: $status"
          echo "Orchestration content-type: ${content_type:-missing}"
          echo "Orchestration response: $body"

          test "$status" = "200"
          echo "$content_type" | grep -q 'application/json'
          echo "$body" | jq -e '.ok == true' >/dev/null
          echo "$body" | jq -e '.state.workspaceId == "natural-nation"' >/dev/null
          echo "$body" | jq -e '.state.packageId == "NN-BUILD-001"' >/dev/null
          echo "$body" | jq -e '.state.tasks | type == "array"' >/dev/null
          echo "Canonical orchestration route returned valid production JSON."

      - name: Verify browser-equivalent Build Work requests
        shell: bash
        run: |
          set -euo pipefail
          origin="https://natural-nation-mvp.github.io"
          cache_key="$(date +%s)"
          gateway="https://founder-os-gateway.dmoseley1024.workers.dev/v1/workspaces/natural-nation/packages/NN-BUILD-001/orchestration?v=${cache_key}"
          package="https://natural-nation-mvp.github.io/natural-nation-mvp/execution-packages/NN-BUILD-001.json?v=${cache_key}"
          registry="https://natural-nation-mvp.github.io/natural-nation-mvp/founder-os/config/ai-agent-registry.json?v=${cache_key}"

          gateway_body="$(curl --fail --silent --show-error -H "Origin: ${origin}" "$gateway")"
          package_body="$(curl --fail --silent --show-error "$package")"
          registry_body="$(curl --fail --silent --show-error "$registry")"

          echo "$gateway_body" | jq -e '.ok == true and .state.packageId == "NN-BUILD-001"' >/dev/null
          echo "$package_body" | jq -e '.packageId == "NN-BUILD-001" and .workspaceId == "natural-nation"' >/dev/null
          echo "$registry_body" | jq -e '.agents | type == "array"' >/dev/null
          echo "Browser-equivalent Build Work requests verified."

      - name: Verify NN-KS-002 workflow endpoint
        run: |
          RESPONSE="$(curl --fail --silent --show-error -H 'x-founder-os-workspace: workspace-natural-nation' https://founder-os-gateway.dmoseley1024.workers.dev/api/founder-os/workflows/nn-ks-002)"
          echo "$RESPONSE" | grep -q '"id":"nn-ks-002"'
          echo "$RESPONSE" | grep -q '"workspaceId":"workspace-natural-nation"'
          echo "$RESPONSE" | grep -q '"persisted":true'
          echo "NN-KS-002 live workflow endpoint and persistence verified."
