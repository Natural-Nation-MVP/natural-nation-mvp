name: Founder OS Stabilization

on:
  pull_request:
    paths:
      - 'docs/founder-os/**'
      - 'services/founder-os-gateway/**'
      - 'scripts/validate-founder-os.mjs'
      - 'scripts/validate-command-center.mjs'
      - 'scripts/validate-live-backlog.mjs'
      - 'scripts/validate-founder-runtime-controllers.mjs'
      - 'scripts/validate-founder-action-inventory.mjs'
      - 'scripts/validate-founder-approval-inbox.mjs'
      - 'scripts/validate-founder-ai-team-controls.mjs'
      - 'scripts/validate-founder-ux-001.mjs'
      - 'scripts/validate-founder-ws-001.mjs'
      - 'scripts/validate-founder-ws-005.mjs'
      - 'scripts/validate-usage-optimization.mjs'
      - 'scripts/verify-founder-os-live-deployment.mjs'
      - '.github/workflows/deploy-founder-os-pilot.yml'
      - '.github/workflows/founder-os-stabilization.yml'
  push:
    branches:
      - 'main'
      - 'agent/orchestration-main-integration'
    paths:
      - 'docs/founder-os/**'
      - 'services/founder-os-gateway/**'
      - 'scripts/validate-founder-os.mjs'
      - 'scripts/validate-command-center.mjs'
      - 'scripts/validate-live-backlog.mjs'
      - 'scripts/validate-founder-runtime-controllers.mjs'
      - 'scripts/validate-founder-action-inventory.mjs'
      - 'scripts/validate-founder-approval-inbox.mjs'
      - 'scripts/validate-founder-ai-team-controls.mjs'
      - 'scripts/validate-founder-ux-001.mjs'
      - 'scripts/validate-founder-ws-001.mjs'
      - 'scripts/validate-founder-ws-005.mjs'
      - 'scripts/validate-usage-optimization.mjs'
      - 'scripts/verify-founder-os-live-deployment.mjs'
      - '.github/workflows/deploy-founder-os-pilot.yml'
      - '.github/workflows/founder-os-stabilization.yml'

permissions:
  contents: read

jobs:
  validate-founder-os:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live deployment verifier syntax
        run: node --check scripts/verify-founder-os-live-deployment.mjs
      - name: Audit all Founder OS validators
        shell: bash
        run: |
          set +e
          failures=0
          validators=(
            scripts/validate-founder-os.mjs
            scripts/validate-command-center.mjs
            scripts/validate-live-backlog.mjs
            scripts/validate-founder-runtime-controllers.mjs
            scripts/validate-founder-action-inventory.mjs
            scripts/validate-founder-approval-inbox.mjs
            scripts/validate-founder-ai-team-controls.mjs
            scripts/validate-founder-ux-001.mjs
            scripts/validate-founder-ws-001.mjs
            scripts/validate-founder-ws-005.mjs
            scripts/validate-usage-optimization.mjs
          )
          for validator in "${validators[@]}"; do
            echo "::group::$validator"
            node "$validator"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error file=$validator::$validator failed with exit code $status"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures Founder OS validator(s) failed. Review all errors above."
            exit 1
          fi
      - name: Test NN-KS-002 live workflow
        working-directory: services/founder-os-gateway
        run: node --test test/nn-ks-002.test.mjs
      - name: Test complete Gateway suite
        id: gateway-tests
        working-directory: services/founder-os-gateway
        shell: bash
        run: |
          set +e
          npm test > gateway-test.log 2>&1
          status=$?
          cat gateway-test.log
          exit "$status"
      - name: Upload Gateway test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-diagnostics
          path: services/founder-os-gateway/gateway-test.log
          if-no-files-found: ignore
