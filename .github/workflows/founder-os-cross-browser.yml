name: Founder OS Cross-Browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/founder-os/**'
      - 'qa/founder-os-browser/**'
      - '.github/workflows/founder-os-cross-browser.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/founder-os/**'
      - 'qa/founder-os-browser/**'
      - '.github/workflows/founder-os-cross-browser.yml'

permissions:
  contents: read

jobs:
  browser-functional-qa:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    defaults:
      run:
        working-directory: qa/founder-os-browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned QA dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install ${{ matrix.browser }} and operating-system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Founder OS functional audit in ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload ${{ matrix.project }} report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: founder-os-${{ matrix.project }}-report
          path: |
            qa/founder-os-browser/playwright-report/
            qa/founder-os-browser/test-results/
          if-no-files-found: ignore
          retention-days: 30
