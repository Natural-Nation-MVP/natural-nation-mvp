name: Founder OS Cross-Browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/founder-os/**'
      - 'qa/founder-os-browser/**'
      - '.github/workflows/founder-os-cross-browser.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/founder-os/**'
      - 'qa/founder-os-browser/**'
      - '.github/workflows/founder-os-cross-browser.yml'

permissions:
  contents: read

concurrency:
  group: founder-os-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-functional-qa:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium and Mobile Chrome
            browser: chromium
            projects: --project=chromium --project=mobile-chrome
            artifact: chromium
          - label: Firefox
            browser: firefox
            projects: --project=firefox
            artifact: firefox
          - label: WebKit and Mobile Safari
            browser: webkit
            projects: --project=webkit --project=mobile-safari
            artifact: webkit

    defaults:
      run:
        working-directory: qa/founder-os-browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned QA dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install ${{ matrix.browser }} and operating-system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Founder OS functional audit in ${{ matrix.label }}
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload ${{ matrix.label }} report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: founder-os-${{ matrix.artifact }}-report
          path: |
            qa/founder-os-browser/playwright-report/
            qa/founder-os-browser/test-results/
          if-no-files-found: ignore
          retention-days: 30
